    function shade(hex, percent) {
      const f = parseInt(hex.slice(1), 16);
      const t = percent < 0 ? 0 : 255;
      const p = Math.abs(percent);
      const R = f >> 16, G = (f >> 8) & 0x00FF, B = f & 0x0000FF;
      return '#' + (0x1000000 + (Math.round((t - R) * p) + R) * 0x10000 + (Math.round((t - G) * p) + G) * 0x100 + (Math.round((t - B) * p) + B)).toString(16).slice(1);
    }

    function waterBar(level) {

      for (let i = 0; i < 3; i++) {
        bars += `<span class="inline-block w-2 h-3 rounded-sm ${i < v ? 'bg-blue-500' : 'bg-ink-200 dark:bg-ink-700'}"></span>`;
      }
      return bars;
    }

    function performanceBar(level, max = 3) {
      const levels = ['None', 'Light', 'Medium', 'Heavy'];
      const idx = levels.indexOf(level);
      if (idx === -1) return '';
      let bars = '';
      for (let i = 0; i < max; i++) {
        bars += `<span class="inline-block w-1.5 h-3 rounded-sm ${i < (max - idx) ? 'bg-current opacity-80' : 'bg-current opacity-15'}"></span>`;

            <div class="flex flex-wrap gap-2">
              ${ink.similar.map(s => `<span class="px-3 py-1.5 text-xs rounded-full border border-ink-200 dark:border-ink-600"><span class="font-medium">${s.name}</span> <span class="opacity-60">· ${s.rel}</span></span>`).join('')}
            </div>
          </section>` : ''}
          <footer class="flex items-center justify-between pt-4 border-t border-ink-200 dark:border-ink-700 text-xs text-ink-500 dark:text-ink-400">
            <span>数据来自 Mountain of Ink 真实评测</span>
            <a href="${ink.source}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 hover:text-ink-700 dark:hover:text-ink-200 transition-colors">
              查看原文
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
            </a>
          </footer>
        </div>`;
    }

    function renderPenDetail(pen) {
      return `
        <button onclick="closeDetail()" class="absolute top-4 right-4 z-10 p-2 rounded-full bg-white/90 dark:bg-ink-800/90 hover:bg-white dark:hover:bg-ink-700 transition-colors shadow-md" aria-label="关闭">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
        <div class="relative h-48 sm:h-56 overflow-hidden bg-gradient-to-br from-ink-700 via-ink-600 to-ink-800">
          <div class="absolute inset-0 flex flex-col items-center justify-center text-white text-center px-4">
            <p class="text-xs uppercase tracking-widest opacity-70 mb-1">${pen.brand}</p>
            <h2 class="font-serif text-4xl sm:text-5xl font-medium">${pen.name}</h2>
            <p class="mt-2 text-sm opacity-90">${pen.collection} 系列 · ${pen.nibSize} 笔尖</p>
          </div>
          <div class="absolute bottom-3 left-3 px-3 py-1 text-xs rounded-full backdrop-blur-md bg-white/85 text-ink-800 font-medium">
            ✒️ 钢笔评测
          </div>
        </div>
        <div class="p-6 sm:p-8 space-y-6">
          <section>
            <h3 class="text-xs uppercase tracking-widest text-ink-500 dark:text-ink-400 font-medium mb-2">评测摘要</h3>
            <p class="text-ink-700 dark:text-ink-200 leading-relaxed">${pen.summary}</p>
          </section>
          <section class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            ${perfCard('笔尖', pen.nibSize)}
            ${perfCard('材质', pen.material.split('/')[0])}
            ${perfCard('重量', pen.weight)}
            ${perfCard('上墨', pen.fillingSystem)}
          </section>
          <section>
            <h3 class="text-xs uppercase tracking-widest text-ink-500 dark:text-ink-400 font-medium mb-3">规格</h3>
            <div class="grid grid-cols-2 gap-3 text-sm">
              ${detailRow('长度', pen.length)}
              ${detailRow('系列', pen.collection)}
            </div>
          </section>
          ${pen.pros ? `
          <section class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <h3 class="text-xs uppercase tracking-widest text-green-600 dark:text-green-400 font-medium mb-2">✓ 优点</h3>
              <ul class="space-y-1.5 text-sm text-ink-700 dark:text-ink-200">
                ${pen.pros.map(p => `<li class="flex gap-2"><span class="text-green-600">•</span><span>${p}</span></li>`).join('')}
              </ul>
            </div>
            <div>
              <h3 class="text-xs uppercase tracking-widest text-amber-600 dark:text-amber-400 font-medium mb-2">⚠ 缺点</h3>
              <ul class="space-y-1.5 text-sm text-ink-700 dark:text-ink-200">
                ${pen.cons.map(c => `<li class="flex gap-2"><span class="text-amber-600">•</span><span>${c}</span></li>`).join('')}
              </ul>
            </div>
          </section>` : ''}
          <footer class="flex items-center justify-between pt-4 border-t border-ink-200 dark:border-ink-700 text-xs text-ink-500 dark:text-ink-400">
            <span>数据来自 Mountain of Ink 真实评测</span>
            <a href="${pen.source}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 hover:text-ink-700 dark:hover:text-ink-200 transition-colors">
              查看原文
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
            </a>
          </footer>
        </div>`;
    }

    function renderPaperDetail(paper) {
      return `
        <button onclick="closeDetail()" class="absolute top-4 right-4 z-10 p-2 rounded-full bg-white/90 dark:bg-ink-800/90 hover:bg-white dark:hover:bg-ink-700 transition-colors shadow-md" aria-label="关闭">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
        <div class="relative h-48 sm:h-56 overflow-hidden bg-gradient-to-br from-amber-50 via-stone-100 to-amber-100 dark:from-ink-700 dark:via-ink-600 dark:to-ink-700">
          <div class="absolute inset-0 flex flex-col items-center justify-center text-ink-700 dark:text-ink-100 text-center px-4">
            <p class="text-xs uppercase tracking-widest opacity-60 mb-1">${paper.brand}</p>
            <h2 class="font-serif text-4xl sm:text-5xl font-medium">${paper.name}</h2>
            <p class="mt-2 text-sm opacity-80">${paper.collection}</p>
          </div>
          <div class="absolute bottom-3 left-3 px-3 py-1 text-xs rounded-full backdrop-blur-md bg-white/85 text-ink-800 font-medium">
            📄 纸张评测
          </div>
        </div>
        <div class="p-6 sm:p-8 space-y-6">
          <section>
            <h3 class="text-xs uppercase tracking-widest text-ink-500 dark:text-ink-400 font-medium mb-2">评测摘要</h3>
            <p class="text-ink-700 dark:text-ink-200 leading-relaxed">${paper.summary}</p>
          </section>
          <section class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            ${perfCard('克重', paper.weight)}
            ${perfCard('颜色', paper.color)}
            ${perfCard('类型', paper.paperType)}
            ${perfCard('格式', paper.format.split(' ')[0])}
          </section>
          ${paper.pros ? `
          <section class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <h3 class="text-xs uppercase tracking-widest text-green-600 dark:text-green-400 font-medium mb-2">✓ 优点</h3>
              <ul class="space-y-1.5 text-sm text-ink-700 dark:text-ink-200">
                ${paper.pros.map(p => `<li class="flex gap-2"><span class="text-green-600">•</span><span>${p}</span></li>`).join('')}
              </ul>
            </div>
            <div>
              <h3 class="text-xs uppercase tracking-widest text-amber-600 dark:text-amber-400 font-medium mb-2">⚠ 缺点</h3>
              <ul class="space-y-1.5 text-sm text-ink-700 dark:text-ink-200">
                ${paper.cons.map(c => `<li class="flex gap-2"><span class="text-amber-600">•</span><span>${c}</span></li>`).join('')}
              </ul>
            </div>
          </section>` : ''}
          <footer class="flex items-center justify-between pt-4 border-t border-ink-200 dark:border-ink-700 text-xs text-ink-500 dark:text-ink-400">
            <span>数据来自 Mountain of Ink 真实评测</span>
            <a href="${paper.source}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 hover:text-ink-700 dark:hover:text-ink-200 transition-colors">
              查看原文
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
            </a>
          </footer>
        </div>`;
    }

    function perfCard(label, value, badge = '', extra = '') {
      return `
        <div class="bg-ink-50 dark:bg-ink-700/50 rounded-xl p-3 border border-ink-200 dark:border-ink-600">
          <p class="text-[10px] uppercase tracking-wider text-ink-500 dark:text-ink-400 mb-1">${label}</p>
          <p class="text-lg font-semibold text-ink-800 dark:text-ink-100 capitalize">${value} ${badge}</p>
          ${extra ? `<div class="mt-1.5 flex gap-0.5">${extra}</div>` : ''}
        </div>`;
    }

    function detailRow(label, value, visualKey = null) {
      let visual = visualKey === 'performanceBar' ? performanceBar(value) : '';
      return `
        <div class="flex items-center justify-between py-1.5 border-b border-ink-100 dark:border-ink-700/50 last:border-0">
          <span class="text-ink-500 dark:text-ink-400 text-xs">${label}</span>
          <span class="font-medium text-ink-800 dark:text-ink-100 flex items-center gap-2 capitalize">
            ${value}
            ${visual ? `<span class="flex gap-0.5 text-ink-600 dark:text-ink-300">${visual}</span>` : ''}
          </span>
        </div>`;
    }

    // ============================================================
    // 筛选渲染
    // ============================================================
    function renderFilters() {
      const typeData = ALL_DATA.filter(d => d.type === state.type);
      const config = FILTER_CONFIG[state.type];
      const container = $('#filterContainer');
      let html = '';

      config.forEach(f => {
        if (f.type === 'color') {
          const colorFamilies = Object.keys(COLOR_META).filter(c => typeData.some(d => d.colorFamily === c));
          html += `<div class="mb-5"><h3 class="text-xs font-medium mb-2 text-ink-700 dark:text-ink-300">${f.label}</h3>
            <div class="flex flex-wrap gap-1.5">${colorFamilies.map(c => {
              const meta = COLOR_META[c];
              const active = (state.filters.colorFamily || new Set()).has(c);
              return `<button data-filter-key="colorFamily" data-filter-value="${c}" class="nav-pill text-[11px] px-2.5 py-1.5 rounded-full border ${active ? 'border-transparent' : 'border-ink-200 dark:border-ink-700'} ${active ? 'active' : 'hover:bg-ink-100 dark:hover:bg-ink-700'} transition-all flex items-center gap-1.5" style="${active ? `background:${meta.hex};color:white;` : ''}">
                <span class="w-2.5 h-2.5 rounded-full" style="background:${meta.hex}"></span>${meta.label}
              </button>`;
            }).join('')}</div></div>`;
        } else if (f.type === 'pill') {
          const values = uniqueValues(typeData, f.key);
          const activeSet = state.filters[f.key] || new Set();
          html += `<div class="mb-5"><h3 class="text-xs font-medium mb-2 text-ink-700 dark:text-ink-300">${f.label}</h3>
            <div class="flex flex-wrap gap-1.5">${values.map(v => {
              const active = activeSet.has(v);
              return `<button data-filter-key="${f.key}" data-filter-value="${v}" class="nav-pill text-[11px] px-2.5 py-1 rounded-full border ${active ? 'border-ink-800 dark:border-ink-200 bg-ink-800 dark:bg-ink-200 text-white dark:text-ink-800' : 'border-ink-200 dark:border-ink-700'} hover:bg-ink-100 dark:hover:bg-ink-700 transition-all">${v}</button>`;
            }).join('')}</div></div>`;
        } else if (f.type === 'checkbox') {
          html += `<div class="mb-5"><h3 class="text-xs font-medium mb-2 text-ink-700 dark:text-ink-300">${f.label}</h3>
            <div class="space-y-2">${f.options.map(opt => `
              <label class="flex items-center gap-2 text-sm cursor-pointer">
                <input type="checkbox" data-filter-key="property" data-filter-value="${opt.value}" ${state.filters[opt.value] ? 'checked' : ''} class="rounded text-ink-700 focus:ring-ink-500" />
                <span>${opt.label}</span>
              </label>`).join('')}</div></div>`;
        } else if (f.type === 'range') {
          html += `<div class="mb-2"><h3 class="text-xs font-medium mb-2 text-ink-700 dark:text-ink-300">${f.label}</h3>
            <div class="flex items-center gap-2 text-sm">
              <input type="number" id="dryTimeMin" placeholder="最快" value="${state.filters.dryMin || ''}" class="w-full px-2 py-1 bg-ink-50 dark:bg-ink-700 border border-ink-200 dark:border-ink-600 rounded text-center" />
              <span class="text-ink-400">—</span>
              <input type="number" id="dryTimeMax" placeholder="最慢" value="${state.filters.dryMax || ''}" class="w-full px-2 py-1 bg-ink-50 dark:bg-ink-700 border border-ink-200 dark:border-ink-600 rounded text-center" />
            </div></div>`;
        }
      });

      container.innerHTML = html;

      // 绑定事件
      $$('#filterContainer [data-filter-key]').forEach(el => {
        el.onclick = (e) => {
          e.preventDefault();
          const key = el.dataset.filterKey;
          const val = el.dataset.filterValue;
          if (key === 'property') {
            state.filters[val] = el.checked;
          } else {
            if (!state.filters[key]) state.filters[key] = new Set();
            state.filters[key].has(val) ? state.filters[key].delete(val) : state.filters[key].add(val);
          }
          renderFilters();
          update();
        };
      });

      // dryTime 输入
      const dmin = $('#dryTimeMin'), dmax = $('#dryTimeMax');
      if (dmin) dmin.oninput = (e) => { state.filters.dryMin = e.target.value ? parseInt(e.target.value) : null; update(); };
      if (dmax) dmax.oninput = (e) => { state.filters.dryMax = e.target.value ? parseInt(e.target.value) : null; update(); };
    }

    function applyFilters() {
      const q = state.search.toLowerCase().trim();
      let result = ALL_DATA.filter(d => d.type === state.type);

      result = result.filter(d => {
        if (q) {
          const hay = `${d.brand} ${d.name} ${d.colorDesc || ''} ${d.collection} ${d.summary || ''}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        if (state.type === 'ink') {
          if (state.filters.colorFamily?.size && !state.filters.colorFamily.has(d.colorFamily)) return false;
          if (state.filters.brand?.size && !state.filters.brand.has(d.brand)) return false;
          if (state.filters.collection?.size && !state.filters.collection.has(d.collection)) return false;
          if (state.filters.sheen && !d.sheen) return false;
          if (state.filters.shimmer && !d.shimmer) return false;
          if (state.filters.highShading && d.shading !== 'high') return false;
          if (state.filters.waterResistant && d.waterResistant !== 'High' && d.waterResistant !== 'Medium') return false;
          if (state.filters.dryMin !== null && d.dryTime < state.filters.dryMin) return false;
          if (state.filters.dryMax !== null && d.dryTime > state.filters.dryMax) return false;
        } else {
          if (state.filters.brand?.size && !state.filters.brand.has(d.brand)) return false;
          if (state.filters.collection?.size && !state.filters.collection.has(d.collection)) return false;
          if (state.filters.nibSize?.size && !state.filters.nibSize.has(d.nibSize)) return false;
          if (state.filters.weight?.size && !state.filters.weight.has(d.weight)) return false;
        }
        return true;
      });

      // 排序
      if (state.sort === 'name') result.sort((a, b) => a.name.localeCompare(b.name));
      else if (state.sort === 'brand') result.sort((a, b) => a.brand.localeCompare(b.brand));
      else {
        result.sort((a, b) => {
          const an = typeof a.review === 'number' ? a.review : 0;
          const bn = typeof b.review === 'number' ? b.review : 0;
          return bn - an;
        });
      }

      return result;
    }

    function update() {
      const filtered = applyFilters();
      $('#inkGrid').innerHTML = filtered.map(renderCard).join('');
      const total = ALL_DATA.filter(d => d.type === state.type).length;
      $('#resultCount').textContent = `显示 ${filtered.length} / ${total} 款`;
      $('#emptyState').classList.toggle('hidden', filtered.length > 0);
    }

    function resetAllFilters() {
      state.search = '';
      state.filters = {};
      $('#searchInput').value = '';
      $$('input[type=checkbox][data-filter-key]').forEach(c => c.checked = false);
      renderFilters();
      update();
    }

    // ============================================================
    // 详情模态
    // ============================================================
    function openDetail(id) {
      const item = ALL_DATA.find(d => d.id === id);
      if (!item) return;
      $('#modalContent').innerHTML = renderDetail(item);
      $('#detailModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeDetail() {
      $('#detailModal').classList.add('hidden');
      document.body.style.overflow = '';
    }

    $('#modalBackdrop').onclick = closeDetail;
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDetail(); });

    // ============================================================
    // 类型切换
    // ============================================================
    $$('.type-tab').forEach(tab => {
      tab.onclick = () => {
        $$('.type-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        state.type = tab.dataset.type;
        state.filters = {};
        // 更新排序选项
        if (state.type === 'ink') {
          $('#sortSelect').innerHTML = `
            <option value="default">默认</option>
            <option value="name">名称 A-Z</option>
            <option value="brand">品牌 A-Z</option>
            <option value="dryTime">干涸时间↑</option>
            <option value="waterResistant">防水性↑</option>`;
        } else {
          $('#sortSelect').innerHTML = `
            <option value="default">默认</option>
            <option value="name">名称 A-Z</option>
            <option value="brand">品牌 A-Z</option>`;
        }
        state.sort = 'default';
        $('#sortSelect').value = 'default';
        renderFilters();
        update();
      };
    });

    // ============================================================
    // 主题
    // ============================================================
    function initTheme() {
      const stored = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (stored === 'dark' || (!stored && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
      updateThemeIcon();
    }

    function updateThemeIcon() {
      const isDark = document.documentElement.classList.contains('dark');
      $('#sunIcon').classList.toggle('hidden', !isDark);
      $('#moonIcon').classList.toggle('hidden', isDark);
    }

    $('#themeToggle').onclick = () => {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
      updateThemeIcon();
    };

    // ============================================================
    // 事件绑定
    // ============================================================
    $('#searchInput').addEventListener('input', debounce((e) => {
      state.search = e.target.value;
      update();
    }, 150));

    $('#sortSelect').addEventListener('change', (e) => {
      state.sort = e.target.value;
      update();
    });

    $('#resetFilters').onclick = resetAllFilters;

    // ============================================================
    // 启动
    // ============================================================
    initTheme();
    $('#totalCount').textContent = ALL_DATA.length.toLocaleString();
    $('#inkCount').textContent = INK_DATA.length;
    $('#penCount').textContent = PEN_DATA.length;
    $('#paperCount').textContent = PAPER_DATA.length;
    renderFilters();
    update();
  </script>
</body>
</html>
